services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_dev
      POSTGRES_DB: orderflow
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # panel web: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5

  mongo:
    image: mongo:8
    ports: ["27018:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    # Sin "ports": no es alcanzable desde el host, solo desde la red interna
    # de docker-compose (por nombre de servicio). Único que expone puerto es
    # el gateway.
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://orderflow:orderflow_dev@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://orderflow:orderflow_dev@postgres:5432/inventory_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-service:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://orderflow:orderflow_dev@postgres:5432/orders_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      INVENTORY_SERVICE_URL: http://inventory-service:4002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_started

  notifications-service:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4004
      MONGODB_URL: mongodb://mongo:27017/notifications
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_ACCESS_SECRET: dev-access-secret-change-in-prod
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      INVENTORY_SERVICE_URL: http://inventory-service:4002
      ORDERS_SERVICE_URL: http://orders-service:4003
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:4004
    depends_on:
      - auth-service
      - inventory-service
      - orders-service
      - notifications-service

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  mongodata:
  prometheusdata:
  grafanadata:
