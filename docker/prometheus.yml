global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:3000"]
  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:4001"]
  - job_name: inventory-service
    static_configs:
      - targets: ["inventory-service:4002"]
  - job_name: orders-service
    static_configs:
      - targets: ["orders-service:4003"]
  - job_name: notifications-service
    static_configs:
      - targets: ["notifications-service:4004"]
